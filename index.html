{
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WESTERN OUTLAW - BETA</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#17110c;color:white;font-family:Arial;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;cursor:crosshair}
#betaTag{position:fixed;top:14px;right:16px;z-index:10;background:#b52b25;color:white;padding:8px 17px;font-size:18px;font-weight:bold;letter-spacing:3px;border:2px solid white;border-radius:5px;pointer-events:none}
#hud{position:fixed;top:12px;left:12px;z-index:5;background:#21170ddd;padding:12px 16px;border:2px solid #a77a42;border-radius:8px;line-height:1.6;font-weight:bold;pointer-events:none}
.small{font-size:11px;color:#e8d1ad}
#prompt{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#17110cee;padding:12px 20px;border:2px solid #d5a65e;border-radius:6px;display:none;font-weight:bold;z-index:5}
#shop,#dead{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:20}
.panel{background:#382719;border:3px solid #c99a54;padding:24px;width:min(420px,92vw);max-height:90vh;overflow:auto;text-align:center;border-radius:10px;box-shadow:0 10px 50px #000}
.panel h1{color:#f2c47d;margin-top:0}
.shopItem,button{display:block;width:100%;padding:12px;margin:9px 0;background:#9a642e;color:white;border:2px solid #e4b66d;font-weight:bold;font-size:15px;cursor:pointer;border-radius:5px}
button:hover{background:#bd803c}
button:disabled{opacity:.4;cursor:not-allowed}
.smallText{font-size:12px;color:#e8d1ad}
</style>
</head>
<body>

<div id="betaTag">BETA</div>

<div id="hud">
 <div>HEALTH: <span id="health">100</span></div>
 <div>CASH: $<span id="cash">0</span></div>
 <div>AMMO: <span id="ammo">6</span>/<span id="reserve">36</span></div>
 <div>SCORE: <span id="score">0</span></div>
 <div>HIGH SCORE: <span id="highScore">0</span></div>
 <div>WAVE: <span id="wave">1</span></div>
 <div>DIFFICULTY: <span id="difficulty">EASY</span></div>
 <div class="small">WASD: Move | Mouse: Aim</div>
 <div class="small">CLICK: Shoot | R: Reload</div>
 <div class="small">SPACE: Dodge | E: Shop</div>
</div>

<div id="prompt"></div>

<div id="shop">
 <div class="panel">
  <h1 id="shopTitle">STORE</h1>
  <p>Your cash: $<span id="shopCash">0</span></p>
  <div id="shopItems"></div>
  <p class="smallText" id="shopMessage">Choose an item to purchase.</p>
  <button onclick="closeShop()">LEAVE SHOP</button>
 </div>
</div>

<div id="dead">
 <div class="panel">
  <h1>YOU DIED</h1>
  <p>Your final score: <span id="finalScore">0</span></p>
  <p>The town has fallen...</p>
  <button onclick="location.reload()">TRY AGAIN</button>
 </div>
</div>

<canvas id="game"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=0,H=0;
function resize(){
 W=canvas.width=innerWidth;
 H=canvas.height=innerHeight;
}
addEventListener("resize",resize);
resize();

const world={w:1900,h:1350};

const player={
 x:950,y:850,r:15,
 hp:100,cash:0,
 ammo:6,reserve:36,
 damage:25,speed:3.2,
 lastShot:0,reload:false,
 dodge:0,dodgeCooldown:0,
 angle:0,resistance:0
};

const keys={};
const mouse={x:W/2,y:H/2,down:false};

let enemies=[];
let bullets=[];
let enemyBullets=[];
let particles=[];

let wave=1;
let kills=0;
let score=0;
let highScore=Number(localStorage.getItem("westernHighScore"))||0;
let shopOpen=false;
let gameOver=false;
let bountyActive=false;
let camera={x:0,y:0};

const buildings=[
 {x:250,y:210,w:250,h:180,name:"SALOON",color:"#743b25",type:"saloon"},
 {x:700,y:160,w:260,h:210,name:"SHERIFF",color:"#77704f",type:"sheriff"},
 {x:1250,y:230,w:300,h:180,name:"GENERAL STORE",color:"#9b6535",type:"general"},
 {x:300,y:850,w:280,h:190,name:"STABLE",color:"#67432b",type:"stable"},
 {x:1230,y:850,w:300,h:190,name:"TRADING POST",color:"#80502c",type:"trading"}
];

const inventories={
 saloon:[
  {name:"Health Tonic",price:25,description:"Restore 45 health.",action:()=>{if(player.hp>=100)return "Your health is already full.";player.hp=Math.min(100,player.hp+45);return "Health restored!"}},
  {name:"Whiskey",price:15,description:"Take 50% less damage for 20 seconds.",action:()=>{player.resistance=performance.now()+20000;return "Damage resistance activated!"}},
  {name:"Steak Dinner",price:20,description:"Restore 30 health.",action:()=>{if(player.hp>=100)return "Your health is already full.";player.hp=Math.min(100,player.hp+30);return "You feel better!"}}
 ],
 sheriff:[
  {name:"Revolver Upgrade",price:100,description:"Increase weapon damage by 10.",action:()=>{player.damage+=10;return "Weapon damage upgraded!"}},
  {name:"Ammo Refill",price:15,description:"Get 30 extra bullets.",action:()=>{player.reserve+=30;return "Ammo purchased!"}},
  {name:"Bounty Contract",price:20,description:"Your next kill earns an extra $50.",action:()=>{if(bountyActive)return "You already have an active bounty.";bountyActive=true;return "Bounty accepted! Get hunting."}}
 ],
 general:[
  {name:"Health Tonic",price:25,description:"Restore 45 health.",action:()=>{if(player.hp>=100)return "Your health is already full.";player.hp=Math.min(100,player.hp+45);return "Health restored!"}},
  {name:"Ammo Refill",price:15,description:"Get 30 extra bullets.",action:()=>{player.reserve+=30;return "Ammo purchased!"}},
  {name:"Hardened Bullets",price:50,description:"Increase weapon damage by 10.",action:()=>{player.damage+=10;return "Bullets upgraded!"}}
 ],
 stable:[
  {name:"Speed Boots",price:75,description:"Permanently increase movement speed.",action:()=>{player.speed+=0.5;return "You are faster!"}},
  {name:"Extra Dodge",price:60,description:"Reduce dodge recovery time.",action:()=>{player.dodgeCooldown=Math.max(0,player.dodgeCooldown-40);return "Dodge upgraded!"}},
  {name:"Horse Upgrade",price:150,description:"A powerful upgrade to movement speed.",action:()=>{player.speed+=1;return "Horse upgrade purchased!"}}
 ],
 trading:[
  {name:"Golden Bullets",price:125,description:"Increase weapon damage by 20.",action:()=>{player.damage+=20;return "Golden bullets equipped!"}},
  {name:"Large Ammo Crate",price:40,description:"Get 100 extra bullets.",action:()=>{player.reserve+=100;return "Ammo crate purchased!"}},
  {name:"Medical Kit",price:60,description:"Restore all your health.",action:()=>{if(player.hp>=100)return "Your health is already full.";player.hp=100;return "Fully healed!"}}
 ]
};

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}

function blocked(x,y,r){
 for(const b of buildings){
  let px=clamp(x,b.x,b.x+b.w);
  let py=clamp(y,b.y,b.y+b.h);
  if(Math.hypot(x-px,y-py)<r+2)return true;
 }
 return false;
}

function moveEntity(obj,dx,dy){
 if(!blocked(obj.x+dx,obj.y,obj.r))obj.x+=dx;
 if(!blocked(obj.x,obj.y+dy,obj.r))obj.y+=dy;
 obj.x=clamp(obj.x,obj.r,world.w-obj.r);
 obj.y=clamp(obj.y,obj.r,world.h-obj.r);
}

function nearestShop(){
 let best=null,bd=Infinity;
 for(const b of buildings){
  const px=clamp(player.x,b.x,b.x+b.w);
  const py=clamp(player.y,b.y,b.y+b.h);
  const d=Math.hypot(player.x-px,player.y-py);
  if(d<bd){bd=d;best=b}
 }
 return bd<95?best:null;
}

function enterShop(){
 const b=nearestShop();
 if(!b||shopOpen||gameOver)return;
 shopOpen=true;
 document.getElementById("shopTitle").textContent=b.name;
 document.getElementById("shopCash").textContent=player.cash;
 document.getElementById("shopMessage").textContent="Choose an item to purchase.";
 const container=document.getElementById("shopItems");
 container.innerHTML="";
 for(const item of inventories[b.type]){
  const button=document.createElement("button");
  button.className="shopItem";
  button.textContent=item.name+" — $"+item.price;
  button.title=item.description;
  button.onclick=()=>purchase(item);
  container.appendChild(button);
  const description=document.createElement("div");
  description.className="smallText";
  description.textContent=item.description;
  container.appendChild(description);
 }
 document.getElementById("shop").style.display="flex";
}

function purchase(item){
 const message=document.getElementById("shopMessage");
 if(player.cash<item.price){
  message.textContent="Not enough cash!";
  return;
 }
 const result=item.action();
 if(result.startsWith("Your health")||result.startsWith("You already")){
  message.textContent=result;
  return;
 }
 player.cash-=item.price;
 document.getElementById("shopCash").textContent=player.cash;
 message.textContent=result;
 updateHUD();
}

function closeShop(){
 shopOpen=false;
 document.getElementById("shop").style.display="none";
}

function addScore(points){
 score+=points;
 if(score>highScore){
  highScore=score;
  localStorage.setItem("westernHighScore",highScore);
 }
 updateHUD();
}

addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 keys[k]=true;
 if(k===" "){
  e.preventDefault();
  if(player.dodgeCooldown<=0&&!shopOpen&&!gameOver){
   player.dodge=18;
   player.dodgeCooldown=120;
  }
 }
 if(k==="r")reload();
 if(k==="e"){
  if(shopOpen)closeShop();
  else enterShop();
 }
 if(k==="escape"&&shopOpen)closeShop();
});

addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

canvas.addEventListener("mousemove",e=>{
 mouse.x=e.clientX;
 mouse.y=e.clientY;
});
canvas.addEventListener("mousedown",()=>mouse.down=true);
addEventListener("mouseup",()=>mouse.down=false);

function reload(){
 if(player.reload||player.ammo===6||player.reserve<=0||gameOver)return;
 player.reload=true;
 setTimeout(()=>{
  let amount=Math.min(6-player.ammo,player.reserve);
  player.ammo+=amount;
  player.reserve-=amount;
  player.reload=false;
  updateHUD();
 },1100);
}

function shoot(){
 if(player.reload||player.ammo<=0||performance.now()-player.lastShot<300)return;
 player.lastShot=performance.now();
 player.ammo--;
 let a=player.angle;
 bullets.push({
  x:player.x+Math.cos(a)*22,
  y:player.y+Math.sin(a)*22,
  vx:Math.cos(a)*12,
  vy:Math.sin(a)*12,
  life:55,
  damage:player.damage
 });
 for(let i=0;i<5;i++){
  particles.push({
   x:player.x+Math.cos(a)*25,
   y:player.y+Math.sin(a)*25,
   vx:(Math.random()-.5)*3,
   vy:(Math.random()-.5)*3,
   life:12,color:"#ffc45c"
  });
 }
 updateHUD();
}

function spawnEnemy(){
 let side=Math.floor(Math.random()*4),x,y;
 if(side===0){x=20;y=Math.random()*world.h}
 if(side===1){x=world.w-20;y=Math.random()*world.h}
 if(side===2){x=Math.random()*world.w;y=20}
 if(side===3){x=Math.random()*world.w;y=world.h-20}
 enemies.push({
  x,y,r:15,hp:50+wave*8,
  speed:0.8+Math.random()*.35+wave*.025,
  fire:Math.random()*100,
  color:Math.random()>.5?"#9b3430":"#393c42"
 });
}

function update(){
 if(gameOver||shopOpen)return;

 let dx=(keys.d?1:0)-(keys.a?1:0);
 let dy=(keys.s?1:0)-(keys.w?1:0);
 let len=Math.hypot(dx,dy)||1;
 let speed=player.speed*(player.dodge>0?2.5:1);
 moveEntity(player,dx/len*speed,dy/len*speed);

 if(player.dodge>0)player.dodge--;
 if(player.dodgeCooldown>0)player.dodgeCooldown--;

 camera.x=clamp(player.x-W/2,0,world.w-W);
 camera.y=clamp(player.y-H/2,0,world.h-H);

 player.angle=Math.atan2(mouse.y+camera.y-player.y,mouse.x+camera.x-player.x);
 if(mouse.down)shoot();

 for(const b of bullets){
  b.x+=b.vx;b.y+=b.vy;b.life--;
  for(const e of enemies){
   if(e.hp>0&&dist(b,e)<e.r+5){
    e.hp-=b.damage;
    b.life=0;
    for(let i=0;i<5;i++){
     particles.push({
      x:e.x,y:e.y,
      vx:(Math.random()-.5)*4,
      vy:(Math.random()-.5)*4,
      life:18,color:"#bd4934"
     });
    }
    break;
   }
  }
 }
 bullets=bullets.filter(b=>b.life>0);

 for(const e of enemies){
  if(e.hp<=0)continue;
  let a=Math.atan2(player.y-e.y,player.x-e.x);
  let d=dist(e,player);
  if(d>150){
   let nx=e.x+Math.cos(a)*e.speed;
   let ny=e.y+Math.sin(a)*e.speed;
   if(!blocked(nx,ny,e.r)){e.x=nx;e.y=ny}
  }
  e.fire--;
  if(d<650&&e.fire<=0){
   e.fire=Math.max(35,95+Math.random()*65-wave*3);
   let ba=Math.atan2(player.y-e.y,player.x-e.x);
   enemyBullets.push({
    x:e.x,y:e.y,
    vx:Math.cos(ba)*5,
    vy:Math.sin(ba)*5,
    life:120
   });
  }
  if(d<28&&player.dodge<=0){
   player.hp-=0.12*(performance.now()<player.resistance?0.5:1);
  }
 }

 for(const b of enemyBullets){
  b.x+=b.vx;b.y+=b.vy;b.life--;
  if(dist(b,player)<player.r+5&&player.dodge<=0){
   player.hp-=9*(performance.now()<player.resistance?0.5:1);
   b.life=0;
  }
 }
 enemyBullets=enemyBullets.filter(b=>b.life>0);

 for(const p of particles){
  p.x+=p.vx;p.y+=p.vy;p.life--;
 }
 particles=particles.filter(p=>p.life>0);

 for(const e of enemies){
  if(e.hp<=0&&!e.paid){
   e.paid=true;
   kills++;
   player.cash+=10+wave*2;
   addScore(100);
   if(bountyActive){
    player.cash+=50;
    bountyActive=false;
   }
  }
 }
 enemies=enemies.filter(e=>e.hp>0);

 if(enemies.length===0){
  wave++;
  player.cash+=20;
  addScore(25);
  for(let i=0;i<Math.min(3+wave,15);i++)spawnEnemy();
 }

 if(player.hp<=0){
  player.hp=0;
  gameOver=true;
  document.getElementById("finalScore").textContent=score;
  document.getElementById("dead").style.display="flex";
 }
 updateHUD();
}

function updateHUD(){
 document.getElementById("health").textContent=Math.ceil(player.hp);
 document.getElementById("cash").textContent=player.cash;
 document.getElementById("ammo").textContent=player.ammo;
 document.getElementById("reserve").textContent=player.reserve;
 document.getElementById("score").textContent=score;
 document.getElementById("highScore").textContent=highScore;
 document.getElementById("wave").textContent=wave;

 let difficulty=wave<3?"EASY":wave<6?"MEDIUM":wave<10?"HARD":"DEADLY";
 document.getElementById("difficulty").textContent=difficulty;
}

function draw(){
 ctx.fillStyle="#b58a53";
 ctx.fillRect(0,0,W,H);
 ctx.save();
 ctx.translate(-camera.x,-camera.y);

 // Desert ground
 ctx.fillStyle="#b58a53";
 ctx.fillRect(0,0,world.w,world.h);
 for(let i=0;i<250;i++){
  let x=(i*197)%world.w,y=(i*311)%world.h;
  ctx.fillStyle=i%2?"#a77b49":"#c39a61";
  ctx.fillRect(x,y,3,3);
 }

 // Main road
 ctx.fillStyle="#c8a16a";
 ctx.fillRect(0,590,world.w,180);
 ctx.fillStyle="#ad8050";
 ctx.fillRect(0,600,world.w,4);
 ctx.fillRect(0,755,world.w,4);

 // Buildings
 for(const b of buildings){
  ctx.fillStyle="#4a2e1c";
  ctx.fillRect(b.x+8,b.y+12,b.w,b.h);
  ctx.fillStyle=b.color;
  ctx.fillRect(b.x,b.y,b.w,b.h);
  ctx.fillStyle="#4b2b19";
  ctx.fillRect(b.x-12,b.y-15,b.w+24,35);
  ctx.fillStyle="#d4ad70";
  ctx.fillRect(b.x+b.w/2-42,b.y+b.h-58,84,58);
  ctx.fillStyle="#2c1b12";
  ctx.fillRect(b.x+b.w/2-30,b.y+b.h-45,60,45);
  ctx.fillStyle="#f1d39c";
  ctx.font="bold 18px Arial";
  ctx.textAlign="center";
  ctx.fillText(b.name,b.x+b.w/2,b.y+55);
  ctx.strokeStyle="#d2a66c";
  ctx.lineWidth=3;
  ctx.strokeRect(b.x,b.y,b.w,b.h);
 }

 // Cacti
 for(let i=0;i<25;i++){
  let x=(i*271+100)%world.w;
  let y=(i*193+80)%world.h;
  ctx.fillStyle="#345b32";
  ctx.fillRect(x,y,12,35);
  ctx.fillRect(x-9,y+9,10,7);
  ctx.fillRect(x+10,y+16,9,7);
 }

 // Bullets
 for(const b of bullets){
  ctx.fillStyle="#ffe18a";
  ctx.beginPath();
  ctx.arc(b.x,b.y,4,0,Math.PI*2);
  ctx.fill();
 }
 for(const b of enemyBullets){
  ctx.fillStyle="#ff623c";
  ctx.beginPath();
  ctx.arc(b.x,b.y,5,0,Math.PI*2);
  ctx.fill();
 }

 // Enemies
 for(const e of enemies){
  ctx.fillStyle="#17120f";
  ctx.beginPath();
  ctx.ellipse(e.x,e.y+8,13,8,0,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle=e.color;
  ctx.fillRect(e.x-10,e.y-13,20,25);
  ctx.fillStyle="#d5a36b";
  ctx.beginPath();
  ctx.arc(e.x,e.y-17,9,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle="#332018";
  ctx.fillRect(e.x-13,e.y-25,26,6);
  ctx.fillStyle="#421c16";
  ctx.fillRect(e.x-13,e.y-2,26,5);
  ctx.fillStyle="#f33";
  ctx.fillRect(e.x-15,e.y-34,30,4);
  ctx.fillStyle="#5f1e15";
  ctx.fillRect(e.x-15,e.y-34,30*Math.max(0,e.hp/(50+wave*8)),4);
 }

 // Player
 ctx.fillStyle="#17120f";
 ctx.beginPath();
 ctx.ellipse(player.x,player.y+10,15,9,0,0,Math.PI*2);
 ctx.fill();

 ctx.save();
 ctx.translate(player.x,player.y);
 ctx.rotate(player.angle);
 ctx.fillStyle="#292d36";
 ctx.fillRect(-10,-10,22,25);
 ctx.fillStyle="#d7a36e";
 ctx.beginPath();
 ctx.arc(0,-15,10,0,Math.PI*2);
 ctx.fill();
 ctx.fillStyle="#57351e";
 ctx.fillRect(-15,-25,30,6);
 ctx.fillRect(-8,-31,16,7);
 ctx.fillStyle="#777";
 ctx.fillRect(8,-7,23,6);
 ctx.restore();

 // Particles
 for(const p of particles){
  ctx.globalAlpha=Math.max(0,p.life/18);
  ctx.fillStyle=p.color;
  ctx.fillRect(p.x,p.y,4,4);
 }
 ctx.globalAlpha=1;
 ctx.restore();

 // Crosshair
 ctx.strokeStyle="#fff";
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.arc(mouse.x,mouse.y,9,0,Math.PI*2);
 ctx.stroke();
 ctx.beginPath();
 ctx.moveTo(mouse.x-14,mouse.y);
 ctx.lineTo(mouse.x+14,mouse.y);
 ctx.moveTo(mouse.x,mouse.y-14);
 ctx.lineTo(mouse.x,mouse.y+14);
 ctx.stroke();

 const shop=nearestShop();
 const prompt=document.getElementById("prompt");
 if(shop&&!shopOpen){
  prompt.style.display="block";
  prompt.textContent="PRESS E TO ENTER "+shop.name;
 }else{
  prompt.style.display="none";
 }
}

function loop(){
 update();
 draw();
 requestAnimationFrame(loop);
}

for(let i=0;i<4;i++)spawnEnemy();
updateHUD();
loop();
</script>
</body>
</html>
